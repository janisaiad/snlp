# WavJEPA from local Lightning pretrain checkpoint (same head as HF recipe).
encoder: transformer
encoder_conf:
    output_size: 256
    attention_heads: 8
    linear_units: 1024
    num_blocks: 2
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d2
    normalize_before: true

decoder: none

model_conf:
    ctc_weight: 1.0

unused_parameters: true
freeze_param:
    - frontend.native_jepa

frontend: wavjepa
frontend_conf:
    fs: 16000
    model_name: labhamlet/wavjepa-nat-base
    lightning_checkpoint_path: WAVJEPA_LOCAL_CKPT_PLACEHOLDER
    pretrain_in_channels: 1
    pretrain_process_seconds: 2.01
    pretrain_samples_per_audio: 8
    pretrain_average_top_k_layers: 12
    pretrain_compile_modules: false

preencoder: linear
preencoder_conf:
    input_size: 768
    output_size: 80

num_workers: 4
batch_type: sorted
batch_size: 8
accum_grad: 4
patience: none
init: none
best_model_criterion:
-   - valid
    - loss
    - min
keep_nbest_models: 5

optim: adam
optim_conf:
    lr: 0.0001
    weight_decay: 0.000001

specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 27
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range:
    - 0.
    - 0.05
    num_time_mask: 10

num_iters_per_epoch: 10000
max_epoch: 30
